services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: branch_booking
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d branch_booking"]
      interval: 3s
      timeout: 3s
      retries: 20

  flyway:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/branch_booking
      FLYWAY_USER: postgres
      FLYWAY_PASSWORD: postgres

volumes:
  pgdata:
